[project]
name = "telescopium"
version = "0.1.0"
description = "Scrapes schedules from UMinho's website and exports or exposes collected data through the api"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "lxml>=6.0.2",
    "progress>=1.6.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "starlette>=0.52.1",
    "tatsu<5.8",
    "uvicorn>=0.41.0",
]

[project.optional-dependencies]
ics = [
    "ics>=0.7.2",
]

[tool.black]
target-version = ["py313"]

[dependency-groups]
dev = [
    "black>=26.3.0",
]
